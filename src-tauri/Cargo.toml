[package]
name = "rhfiles-tauri"
version = "0.1.13"
edition = "2024"

[lib]
name = "rhfiles_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rhfiles"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
semver = "1"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhfiles-core = { path = "../crates/rhfiles-core" }
zip = "2"
velopack = { version = "=1.2.110-ge826545", features = ["public-utils"] }
ureq = "3.4"
url = "2.5"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_WNet",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
winreg = "0.55"
tauri-plugin-deep-link = "2"
chrono = "0.4"
libloading = "0.8"
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }
regex = "1"
semver = "1"
suppaftp = { version = "8", features = ["native-tls"] }
native-tls = "0.2"
ssh2 = "0.9"
