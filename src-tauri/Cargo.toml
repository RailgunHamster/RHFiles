[package]
name = "rhfiles-tauri"
version = "0.1.64"
edition = "2024"

[lib]
name = "rhfiles_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rhfiles"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
semver = "1"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhfiles-core = { path = "../crates/rhfiles-core" }
base64 = "0.22"
zip = "2"
ureq = "3.4"
url = "2.5"
[target.'cfg(windows)'.dependencies]
velopack = { version = "=1.2.110-ge826545", features = ["public-utils"] }
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Foundation_Collections",
    "Storage",
    "Storage_Search",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_WNet",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Storage_FileSystem",
    "Win32_System_RemoteDesktop",
    "Win32_System_WinRT",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "=0.62.2"
windows-collections = "=0.3.2"
winreg = "0.55"

[dependencies.rusqlite]
version = "0.32"
features = ["bundled"]

[dependencies.tauri-plugin-deep-link]
version = "2"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[dependencies.chrono]
version = "0.4"

[dependencies.libloading]
version = "0.8"

[dependencies.pinyin]
version = "0.11"
default-features = false
features = ["plain", "heteronym"]

[dependencies.regex]
version = "1"

[dependencies.semver]
version = "1"

[dependencies.suppaftp]
version = "8"
features = ["native-tls"]

[dependencies.native-tls]
version = "0.2"

[dependencies.ssh2]
version = "0.9"

# Distributable .app must not depend on the build runner's Homebrew OpenSSL dylibs.
[target.'cfg(target_os = "macos")'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
