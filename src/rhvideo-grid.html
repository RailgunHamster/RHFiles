<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ipc: http://ipc.localhost https://ipc.localhost; object-src 'none'; frame-src 'none'; media-src 'none'"
    />
    <title>RHFiles · 多视频</title>
    <link rel="stylesheet" href="css/rhvideo-player.css" />
  </head>
  <body>
    <footer id="controls">
      <div class="player-title">
        <strong>多视频同屏</strong><span id="error" role="alert"></span>
      </div>
      <div class="control-row">
        <button id="previous">上一组</button><button id="next">下一组</button
        ><select id="target" aria-label="控制哪个视频">
          <option value="-1">全部视频</option></select
        ><button id="pause">暂停</button><button id="resume">播放</button
        ><button id="mute" aria-pressed="false">静音</button
        ><button id="expand">展开选中</button
        ><button id="restore">恢复网格</button
        ><button id="favorite" disabled aria-pressed="false">收藏</button
        ><button id="mark" disabled aria-pressed="false" title="关闭预览时将已标记视频移入 RHVideo 暂存区，不是永久删除">标记暂存</button
        ><label
          >进度<input
            id="seek"
            type="range"
            min="0"
            max="1000"
            value="0" /></label
        ><label
          >音量<input
            id="volume"
            type="range"
            min="0"
            max="100"
            value="100" /></label
        ><select id="rate" aria-label="速度">
          <option value=".5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
      </div>
      <div id="summary"></div>
      <div class="control-row"><span id="group-position">第 1/1 组</span><input id="group-seek" type="range" min="0" max="1000" value="0" aria-label="同屏分组位置" /></div>
    </footer>
    <script src="js/automation-core.js"></script>
    <script src="js/rhvideo-grid.js"></script>
  </body>
</html>
