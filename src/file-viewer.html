<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RHFiles · 媒体查看器</title><link rel="stylesheet" href="css/file-viewer.css"></head><body>
<header><button id="close" title="关闭 / Close" aria-label="关闭 / Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button><strong id="title"></strong><span id="counter"></span><div id="mode" class="viewer-mode-switch" role="group" aria-label="图片浏览模式"><button id="mode-paged" type="button" aria-pressed="true">逐张翻页</button><button id="mode-continuous" type="button" aria-pressed="false">连续滚动</button></div><button id="video-diagnostics-toggle" type="button" aria-expanded="false" aria-controls="video-diagnostics" hidden>播放诊断</button><button id="system">系统应用</button><button id="fullscreen" title="全屏 / Fullscreen" aria-label="全屏 / Fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></header>
<main id="viewport" tabindex="0"><div id="track"></div><div id="message" role="status"></div><div id="image-selection" hidden></div></main>
<div id="image-menu" role="menu" hidden><div id="image-menu-name"></div><button id="image-save-as" role="menuitem">另存为…</button><button id="image-copy-path" role="menuitem">复制文件路径</button><button id="image-system-open" role="menuitem">使用系统应用打开</button></div>
<footer><aside id="video-diagnostics" aria-labelledby="video-diagnostics-title" hidden><strong id="video-diagnostics-title">播放诊断</strong><div id="video-diagnostics-summary"></div><dl id="video-diagnostics-steps"></dl></aside><div id="image-progress" class="sequence-progress" hidden><input id="image-seek" type="range" min="0" max="0" step="1" value="0" aria-label="图片浏览进度"><span id="image-count" class="sequence-label"></span></div><div class="viewer-actions"><button id="previous" title="上一个 / Previous" aria-label="上一个 / Previous"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><div id="image-controls"><button id="zoom-out" title="缩小 / Zoom out" aria-label="缩小 / Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><button id="fit">适应</button><button id="rotate" title="旋转 / Rotate" aria-label="旋转 / Rotate"><svg viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2.6 6.4M3 4v7h7"/></svg></button><button id="zoom-in" title="放大 / Zoom in" aria-label="放大 / Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button id="auto-scroll" hidden>自动滚动</button><label id="auto-speed-label" hidden><span id="auto-speed-multiplier">1.0×</span><input id="auto-speed" type="range" min="10" max="6000" step="10" value="60" aria-label="自动滚动速度 / Auto scroll speed"><input id="auto-speed-number" type="number" min="10" max="6000" step="10" value="60" aria-label="自动滚动速度（像素/秒） / Auto scroll speed (pixels/sec)"><span>px/s</span></label></div><div id="video-controls" hidden><button id="toggle">暂停</button><span id="position">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度 / Playback position"><span id="duration">0:00</span><select id="rate" aria-label="速度 / Speed"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select><input id="volume" type="range" min="0" max="100" value="100" aria-label="音量 / Volume"><output id="video-volume-value" for="volume">100%</output></div><button id="next" title="下一个 / Next" aria-label="下一个 / Next"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button></div></footer>
<section id="image-focus" role="dialog" aria-modal="true" aria-labelledby="image-focus-title" hidden><header><button id="image-focus-back" type="button">返回浏览 · Esc</button><strong id="image-focus-title"></strong><button id="image-focus-out" type="button" aria-label="缩小">−</button><output id="image-focus-scale">100%</output><button id="image-focus-in" type="button" aria-label="放大">+</button><button id="image-focus-fit" type="button">适应窗口</button></header><div id="image-focus-stage" tabindex="0"><img id="image-focus-image" alt="" draggable="false"><p id="image-focus-message" role="status"></p></div></section>
<aside id="image-save-progress" hidden role="status"><strong id="image-save-title"></strong><button id="image-save-dismiss" aria-label="关闭提示 / Dismiss">×</button><progress id="image-save-bar" max="100"></progress><span id="image-save-detail"></span></aside><script src="js/automation-core.js"></script><script src="js/device-paths.js"></script><script src="js/image-strip.js"></script><script src="js/file-viewer-window.js"></script></body></html>
