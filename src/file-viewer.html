<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RHFiles · 媒体查看器</title><link rel="stylesheet" href="css/file-viewer.css"></head><body>
<header><button id="close" title="关闭 / Close" aria-label="关闭 / Close">✕</button><strong id="title"></strong><span id="counter"></span><select id="mode" aria-label="图片浏览模式 / Image browsing"><option value="paged">逐张翻页</option><option value="continuous">连续滚动</option></select><button id="system">系统应用</button><button id="fullscreen" title="全屏 / Fullscreen">⛶</button></header>
<main id="viewport"><div id="track"></div><div id="message" role="status"></div></main>
<footer><button id="previous" title="上一个 / Previous">❮</button><div id="image-controls"><button id="zoom-out" title="缩小 / Zoom out">−</button><button id="fit">适应</button><button id="rotate" title="旋转 / Rotate">↻</button><button id="zoom-in" title="放大 / Zoom in">＋</button></div><div id="video-controls" hidden><button id="toggle">暂停</button><span id="position">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度 / Playback position"><span id="duration">0:00</span><select id="rate" aria-label="速度 / Speed"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select><input id="volume" type="range" min="0" max="100" value="100" aria-label="音量 / Volume"></div><button id="next" title="下一个 / Next">❯</button></footer>
<script src="js/automation-core.js"></script><script src="js/file-viewer-window.js"></script></body></html>
