<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHFiles</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <div class="tab-bar" id="tab-bar"></div>

  <div class="toolbar">
    <div class="toolbar-nav">
      <button class="tb" onclick="goBack()" title="Back (Alt+Left)">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M8 2L3.5 6 8 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button class="tb" onclick="goForward()" title="Forward (Alt+Right)">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M4 2l4.5 4L4 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button class="tb" onclick="goUp()" title="Up (Backspace)">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 7.5L6 4l3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </div>

    <div class="address-bar" id="address-bar">
      <div id="breadcrumb" class="breadcrumb"></div>
      <div id="bc-dropdown" class="bc-dropdown"></div>
      <input type="text" id="path-input" spellcheck="false">
    </div>

    <div class="search-box">
      <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="3.5" stroke="currentColor" stroke-width="1.3"/><path d="M8.5 8.5L12.5 12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <input type="text" id="filter-input" placeholder="Search" spellcheck="false" oninput="applyFilter()">
    </div>
  </div>

  <div class="command-bar">
    <button class="cmd" id="btn-new" onclick="newFolder()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M1.5 4h5l1.5 1.5h6.5v8H1.5V4z" stroke="currentColor" stroke-width="1.1"/><path d="M8 7.5v4M5.5 9.5h5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
      <span>New</span>
    </button>
    <div class="cmd-sep"></div>
    <button class="cmd" onclick="cutSelected()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="4.5" cy="10.5" r="2" stroke="currentColor" stroke-width="1"/><circle cx="11.5" cy="10.5" r="2" stroke="currentColor" stroke-width="1"/><path d="M6 9l5-6M10 9L5 3" stroke="currentColor" stroke-width="1"/></svg>
      <span>Cut</span>
    </button>
    <button class="cmd" onclick="copySelected()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="4" y="5" width="8" height="9" rx="1" stroke="currentColor" stroke-width="1"/><path d="M5 5V3.5A1.5 1.5 0 0 1 6.5 2H10" stroke="currentColor" stroke-width="1"/></svg>
      <span>Copy</span>
    </button>
    <button class="cmd" onclick="paste()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="3" y="4" width="10" height="11" rx="1" stroke="currentColor" stroke-width="1"/><path d="M6 2h4v3H6z" stroke="currentColor" stroke-width=".9"/><path d="M6 8.5h4M6 10.5h2.5" stroke="currentColor" stroke-width=".9" stroke-linecap="round"/></svg>
      <span>Paste</span>
    </button>
    <button class="cmd" onclick="renamePrompt()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 2l4 4L6 14H2v-4L10 2z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></svg>
      <span>Rename</span>
    </button>
    <button class="cmd" onclick="deleteSelected()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 5h10M5.5 5V3.5h5V5" stroke="currentColor" stroke-width="1"/><path d="M4.5 5l.5 8.5h6l.5-8.5" stroke="currentColor" stroke-width="1"/></svg>
      <span>Delete</span>
    </button>
    <div class="cmd-sep"></div>
    <button class="cmd" id="btn-sort" onclick="toggleSort()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h8M2 12h4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
      <span>Sort</span>
    </button>
    <button class="cmd" id="btn-hidden" onclick="toggleHidden()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M1 8s3-5 7-5 7 5 7 5-3 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1"/></svg>
      <span>Hidden</span>
    </button>
    <span class="cmd-stretch"></span>
    <button class="cmd" onclick="refresh()" title="Refresh (F5)">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M13.5 8A5.5 5.5 0 1 1 8 2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M8 0l2.5 3-2.5 3" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
  </div>

  <div class="body">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-heading">Quick access</div>
        <div class="sidebar-item" onclick="navigateTo(homeDir('Desktop'))">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1"/><path d="M5 14h6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
          <span>Desktop</span>
        </div>
        <div class="sidebar-item" onclick="navigateTo(homeDir('Downloads'))">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2v7M5 6.5L8 9.5l3-3" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 10.5v2.5h11v-2.5" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Downloads</span>
        </div>
        <div class="sidebar-item" onclick="navigateTo(homeDir('Documents'))">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 2h5l4 4v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1"/><path d="M8 2v4h4" stroke="currentColor" stroke-width="1"/></svg>
          <span>Documents</span>
        </div>
        <div class="sidebar-item" onclick="navigateTo(homeDir('Pictures'))">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1"/><circle cx="5.5" cy="6" r="1.5" stroke="currentColor" stroke-width=".9"/><path d="M1 12l4-4 2 2 3-3 5 5" stroke="currentColor" stroke-width="1" stroke-linejoin="round" fill="none"/></svg>
          <span>Pictures</span>
        </div>
        <div class="sidebar-item" onclick="navigateTo(homeDir('Music'))">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="4" cy="12" r="2" stroke="currentColor" stroke-width="1"/><circle cx="12" cy="10" r="2" stroke="currentColor" stroke-width="1"/><path d="M6 12V3l8-2v9" stroke="currentColor" stroke-width="1"/></svg>
          <span>Music</span>
        </div>
        <div class="sidebar-item" onclick="navigateTo(homeDir('Videos'))">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1"/><path d="M6.5 6.5v4l3.5-2z" fill="currentColor"/></svg>
          <span>Videos</span>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-heading">This PC</div>
        <div id="drives-list"></div>
      </div>
    </div>

    <div class="content">
      <div class="file-header" id="file-header">
        <div class="col col-name" data-sort="name" onclick="sortBy('name')">Name <span class="sort-arrow"></span></div>
        <div class="col col-date" data-sort="modified" onclick="sortBy('modified')">Date modified <span class="sort-arrow"></span></div>
        <div class="col col-type" data-sort="type" onclick="sortBy('type')">Type <span class="sort-arrow"></span></div>
        <div class="col col-size" data-sort="size" onclick="sortBy('size')">Size <span class="sort-arrow"></span></div>
      </div>
      <div id="file-list" class="file-list"></div>
      <div class="status-bar" id="status-bar">
        <span id="status-count">0 items</span>
        <span id="status-selection"></span>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
