<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RHFiles · 保存</title><link rel="stylesheet" href="css/save-dialog.css"></head><body>
<header><div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v11H3zM3 7V4h7l2 3"/></svg></div><div><h1 id="heading">另存为</h1><p id="subtitle">RHFiles</p></div></header>
<nav><button id="back" aria-label="后退"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><button id="forward" aria-label="前进"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button><button id="up" aria-label="上一级"><svg viewBox="0 0 24 24"><path d="m6 10 6-6 6 6M12 4v16"/></svg></button><form id="address-form"><input id="address" aria-label="保存位置" spellcheck="false" autocomplete="off"></form><button id="refresh" aria-label="刷新"><svg viewBox="0 0 24 24"><path d="M20 7V3l-3 3a8 8 0 1 0 3 10M20 7h-5"/></svg></button></nav>
<main><aside id="places" aria-label="保存位置"></aside><section class="directory"><div class="directory-tools"><input id="filter" type="search" aria-label="筛选文件" placeholder="筛选文件"><label class="hidden-toggle"><input id="hidden-files" type="checkbox"><span id="hidden-label">隐藏项目</span></label><button id="new-folder"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v11H3zM3 7V4h7l2 3m4 6v6m-3-3h6"/></svg><span id="new-folder-label">新建文件夹</span></button></div><div class="columns"><span id="column-name">名称</span><span id="column-date">修改日期</span><span id="column-size">大小</span></div><div id="entries" role="listbox" tabindex="0" aria-label="文件夹内容"></div><div id="list-status" role="status"></div></section></main>
<footer><p id="problem" role="alert" hidden></p><p id="readonly" hidden>此位置只读，请选择其他保存位置</p><form id="save-form"><label id="name-label" for="filename">文件名</label><input id="filename" autocomplete="off" spellcheck="false" autofocus><label id="type-label" for="filetype">文件类型</label><select id="filetype"><option value="original">原文件格式</option><option value="all">所有文件 (*.*)</option></select><div class="actions"><span id="destination"></span><button id="cancel" type="button">取消</button><button id="save" type="submit" class="primary">保存</button></div></form></footer>
<div id="replace-panel" class="dialog-shade" hidden><section role="dialog" aria-modal="true" aria-labelledby="replace-title"><div class="dialog-symbol"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h5M9 13h6m-6 4h4"/></svg></div><h2 id="replace-title">替换已有文件？</h2><p id="replace-detail"></p><p id="replace-changed" hidden></p><div class="dialog-actions"><button id="replace-back">返回选择</button><button id="replace-confirm" class="primary">替换</button></div></section></div>
<div id="folder-panel" class="dialog-shade" hidden><form id="folder-form" role="dialog" aria-modal="true" aria-labelledby="folder-title"><h2 id="folder-title">新建文件夹</h2><input id="folder-name" aria-label="文件夹名称" autocomplete="off"><p id="folder-error" role="alert"></p><div class="dialog-actions"><button id="folder-cancel" type="button">取消</button><button id="folder-create" type="submit" class="primary">创建</button></div></form></div>
<script src="js/automation-core.js"></script><script src="js/device-paths.js"></script><script src="js/save-dialog-env.js"></script><script src="js/theme.js"></script><script src="js/save-dialog-window.js"></script></body></html>
