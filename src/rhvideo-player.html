<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ipc: http://ipc.localhost https://ipc.localhost; object-src 'none'; frame-src 'none'; media-src 'none'; base-uri 'none'">
<title>RHFiles · 播放器</title><link rel="stylesheet" href="css/rhvideo-player.css"></head><body>
<footer id="controls"><div class="player-title"><button id="back">返回媒体库</button><strong id="title">正在打开…</strong><span id="status">正在准备播放…</span><span id="error" role="alert"></span></div>
<div class="control-row"><button id="previous" aria-label="上一个视频">上一段</button><button id="toggle" aria-label="暂停或继续">暂停</button><button id="next" aria-label="下一个视频">下一段</button><span id="position">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"><span id="duration">0:00</span><select id="rate" aria-label="播放速度"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><label>音量<input id="volume" type="range" min="0" max="100" value="100" aria-label="音量"></label><button id="fullscreen">全屏</button></div></footer>
<script src="js/automation-core.js"></script><script src="js/rhvideo-model.js"></script><script src="js/rhvideo-player.js"></script></body></html>
