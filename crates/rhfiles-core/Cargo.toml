[package]
name = "rhfiles-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = "0.25"
rayon = "1"
base64 = "0.22"
notify = { version = "7", optional = true }
chrono = "0.4"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
digest = "0.10"
