[package]
name = "rhfiles-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rhfiles"
path = "src/main.rs"

[dependencies]
rhfiles-core = { path = "../rhfiles-core" }
slint = { version = "~1.14.0" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[build-dependencies]
slint-build = { version = "~1.14.0" }
