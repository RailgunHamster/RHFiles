[package]
name = "rhfiles-service"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8", features = ["json", "query", "tokio", "http1", "http2"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
dav-server = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util", "net", "time", "macros"] }
futures-util = "0.3"
cap-std = "4"
cap-fs-ext = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
ring = "0.17.14"
subtle = "2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
bytes = "1"
xmltree = "0.12"
if-addrs = "0.15"
mdns-sd = "0.21.6"
percent-encoding = "2"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Wdk_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
