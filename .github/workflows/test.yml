name: File manager business tests

on:
  push:
    branches: [main]
    paths-ignore: ['android/**', 'docs/**', 'README*']
  pull_request:
    paths-ignore: ['android/**', 'docs/**', 'README*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-business:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Record workflow trigger (no credentials)
        run: node scripts/testing/ci-trigger.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - name: Frontend business scenarios and property tests
        run: npm test
      - name: Verify business tests catch deliberately broken behavior
        run: npm run test:mutations
      - name: Real filesystem, recovery, archive and persistence tests
        run: cargo test --workspace --locked
      - name: Build isolated test application
        run: cargo build -p rhfiles-tauri --locked
      - name: Stage bundled archive engine for the test application
        shell: pwsh
        run: Copy-Item -LiteralPath src-tauri/thirdparty/7z.exe, src-tauri/thirdparty/7z.dll -Destination target/debug
      - name: Prepare real native media test dependencies
        shell: pwsh
        run: |
          choco upgrade vlc --version=3.0.23 --allow-downgrade --yes --no-progress --limit-output
          if ($LASTEXITCODE -notin 0,3010) { throw "VLC test dependency installation failed: $LASTEXITCODE" }
          $vlc = Get-Item -LiteralPath "$env:ProgramFiles/VideoLAN/VLC/libvlc.dll"
          if ($vlc.VersionInfo.FileVersion -notlike '3.0.23*') { throw 'Unexpected native test engine version' }
          ./scripts/prepare-ffmpeg.ps1
          "FFMPEG=$pwd/src-tauri/thirdparty/ffmpeg.exe" >> $env:GITHUB_ENV
      - name: Real WebView2 file workflows including tab drag and delete confirmations
        env:
          RHFILES_NATIVE_PLAYER_QA: '1'
          # CI has no physical GPU/display: actual decode and bounded GDI frames,
          # not a hardware-renderer performance claim. Local acceptance also
          # exercises the ordinary native-hardware-auto output path.
          RHFILES_VLC_COMPATIBILITY: '1'
        run: npm run test:e2e
      - name: Markdown PDF built-in and external converter workflows
        run: npm run test:pdf
      - name: Preserve failure evidence and workflow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-manager-business-evidence
          path: test-artifacts/
          if-no-files-found: ignore
