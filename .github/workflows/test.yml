name: File manager business tests

on:
  push:
    branches: [main]
    paths: ['**', '!android/**', '!docs/**', '!README*', 'android/web/**']
  pull_request:
    paths: ['**', '!android/**', '!docs/**', '!README*', 'android/web/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-business:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Record workflow trigger (no credentials)
        run: node scripts/testing/ci-trigger.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native Perl for static OpenSSL
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          & $perl -MFindBin -MIPC::Cmd -e 'print "Native build Perl ready\n"'
          if ($LASTEXITCODE -ne 0) { throw 'Native Perl required to build bundled OpenSSL' }
          "PERL=$perl" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-business
          cache-on-failure: true
      - run: npm ci --ignore-scripts
      - name: Frontend business scenarios and property tests
        run: npm test
      - name: Verify business tests catch deliberately broken behavior
        run: npm run test:mutations
      - name: Real filesystem, recovery, archive and persistence tests
        run: cargo test --workspace --locked
      - name: Build isolated test application
        run: cargo build -p rhfiles-tauri --locked
      - name: External updater transition readiness, lifecycle, themes and failures
        shell: pwsh
        run: ./scripts/testing/update-splash-check.ps1
      - name: Build owned-window pixel and keyboard test observer
        shell: pwsh
        run: ./scripts/testing/build-owned-native-frame.ps1
      - name: Stage bundled archive engine for the test application
        shell: pwsh
        run: Copy-Item -LiteralPath src-tauri/thirdparty/7z.exe, src-tauri/thirdparty/7z.dll -Destination target/debug
      - name: Prepare real native media test dependencies
        shell: pwsh
        run: |
          choco upgrade vlc --version=3.0.23 --allow-downgrade --yes --no-progress --limit-output
          if ($LASTEXITCODE -notin 0,3010) { throw "VLC test dependency installation failed: $LASTEXITCODE" }
          $vlc = Get-Item -LiteralPath "$env:ProgramFiles/VideoLAN/VLC/libvlc.dll"
          if ($vlc.VersionInfo.FileVersion -notlike '3.0.23*') { throw 'Unexpected native test engine version' }
          ./scripts/prepare-ffmpeg.ps1
          "FFMPEG=$pwd/src-tauri/thirdparty/ffmpeg.exe" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare disposable loopback protocol fixtures
        shell: pwsh
        run: |
          python -m venv test-artifacts/protocol-test-venv
          if ($LASTEXITCODE -ne 0) { throw 'Protocol fixture environment failed' }
          & ./test-artifacts/protocol-test-venv/Scripts/python.exe -m pip install -r scripts/testing/protocol-fixtures-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Protocol fixture dependencies failed' }
      - name: Real WebView2 file workflows including tab drag and delete confirmations
        env:
          RHFILES_NATIVE_PLAYER_QA: '1'
          RHFILES_REQUIRE_NATIVE_DRAG_QA: '1'
          # CI has no physical GPU/display: actual decode and bounded GDI frames,
          # not a hardware-renderer performance claim. Local acceptance also
          # exercises the ordinary native-hardware-auto output path.
          RHFILES_VLC_COMPATIBILITY: '1'
          RHFILES_EXPECT_RENDERER: 'gdi-compatibility'
          RHFILES_EXPECT_ENGINE_VERSION: '3.0.23'
        run: npm run test:e2e
      - name: Markdown PDF built-in and external converter workflows
        run: npm run test:pdf
      - name: Preserve failure evidence and workflow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-manager-business-evidence
          path: test-artifacts/
          if-no-files-found: ignore
