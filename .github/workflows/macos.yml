name: macOS build and file business tests
on:
  push:
    branches: [main]
    paths-ignore: ['android/**', 'docs/**', 'README*']
  pull_request:
    paths-ignore: ['android/**', 'docs/**', 'README*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Record workflow trigger (no credentials)
        run: node scripts/testing/ci-trigger.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-15
          cache-on-failure: true
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Native filesystem, Trash and business regression tests
        run: cargo test --workspace --locked
      - name: Build application and disk image
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RHFiles-macos-15
          path: |
            target/release/bundle/*.app.zip
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
