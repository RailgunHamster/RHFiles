name: Velopack release

on:
  push:
    tags:
      - "v*"
  # Explicitly exercises the full release build/package path without publishing
  # or changing a tag, a GitHub asset, the Windows feed or users' installations.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.decision.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and manifest version
        id: version
        shell: pwsh
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF_NAME: ${{ github.ref_name }}
        run: |
          . ./scripts/platform-version.ps1
          $platformVersion = Get-RHFilesPlatformVersion -Platform Desktop
          $version = $platformVersion.Version
          if ($env:CI_EVENT -eq 'push') { Assert-RHFilesPlatformTag $platformVersion $env:CI_REF_NAME }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Verify whether this immutable version is already published
        if: github.event_name == 'push'
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-github-release.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Plan build or verified no-op
        id: decision
        shell: pwsh
        env:
          CI_PUBLISHED: ${{ steps.existing.outputs.published }}
        run: |
          $build = if ($env:CI_PUBLISHED -eq 'true') { 'false' } else { 'true' }
          "build=$build" >> $env:GITHUB_OUTPUT
          "Build required: $build. Manual runs only validate packaging; they never publish." >> $env:GITHUB_STEP_SUMMARY
  windows-release:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Frontend business regression gate
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Test
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Build and package
        shell: pwsh
        run: .\scripts\package-velopack.ps1 -Version '${{ needs.plan.outputs.version }}'

      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\scripts\publish-windows-github.ps1 `
            -Directory .\dist\velopack-releases `
            -Commit '${{ github.sha }}'

      - name: Save release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RHFiles-${{ needs.plan.outputs.version }}-${{ github.event_name == 'workflow_dispatch' && 'validation-only' || 'release' }}-${{ github.run_id }}
          path: dist/velopack-releases/*
          if-no-files-found: ignore
